            width: 146
            height: 35
            radius: 18
            border_width: 0
            pad_all: 0
            bg_color: 0x2C2C2A
            scrollable: false
            widgets:
              - label:
                  id: pill_ic
                  align: LEFT_MID
                  x: 10
                  text: "\U000F0238"
                  text_font: mdi_22
                  text_color: 0x888780
              - label:
                  id: pill_tx
                  align: LEFT_MID
                  x: 38
                  text: "In attesa"
                  text_font: r_16
                  text_color: 0xB4B2A9
        - button:
            id: btn_minus
            align: TOP_LEFT
            x: 96
