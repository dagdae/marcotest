            y: -7
            width: 360
            height: 360
            min_value: 150
            max_value: 240
            value: 205
            start_angle: 135
            end_angle: 45
            adjustable: false
            clickable: false
            bg_opa: TRANSP
            border_width: 0
            arc_width: 16
            arc_color: 0x2C2C2A
            indicator:
              arc_width: 16
              arc_color: 0xEF9F27
            knob:
