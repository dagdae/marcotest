# --- Parti simulate (al posto di hardware, Wi-Fi e OTA) ---
host:

time:
  - platform: host
    id: sntp_time

display:
  - platform: sdl
    id: tft_display
    dimensions:
      width: 480
      height: 480

touchscreen:
  - platform: sdl
    id: tft_touch
    on_touch:
      - script.execute: wake_screen

sensor:
  - platform: template
    id: temp_stanza
    name: "Temperatura stanza (simulata)"
    unit_of_measurement: "°C"
    device_class: temperature
    update_interval: 2s
    lambda: 'return id(sim_temp);'
  - platform: template
    id: hum_stanza
    name: "Umidità stanza (simulata)"
    unit_of_measurement: "%"
    device_class: humidity
    update_interval: 10s
    lambda: 'return 52.0;'

switch:
  - platform: template
    id: relay_caldaia
    name: "Relè caldaia (simulato)"
    optimistic: true
  - platform: template
    id: sim_wifi
    name: "Wi-Fi simulato"
    optimistic: true
    restore_mode: ALWAYS_ON

output:
  - platform: template
    id: backlight_output
    type: float
    write_action:
      - logger.log:
          format: "Backlight simulato: %.2f"
          args: ["state"]
          level: DEBUG
