            widgets:
              - label:
                  align: CENTER
                  text: "\U000F0374"
                  text_font: mdi_32
                  text_color: 0xF1EFE8
            on_click:
              - lambda: |-
                  if (id(touch_guard)) return;
                  float t = id(termostato).target_temperature;
                  if (std::isnan(t)) t = 20.0f;
                  t = std::max(15.0f, t - 0.5f);
                  id(ui_preset) = 0;
                  auto call = id(termostato).make_call();
                  call.set_target_temperature(t);
                  call.perform();
