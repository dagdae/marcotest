            id: lbl_time
            align: TOP_LEFT
            x: 24
            y: 18
            text: "--:--"
            text_font: r_18
            text_color: 0xB4B2A9
        - label:
            id: lbl_wifi
            align: TOP_RIGHT
            x: -24
            y: 12
            text: "\U000F05AA"
            text_font: mdi_32
            text_color: 0xEF9F27
        - button:
            id: btn_prog
            align: TOP_RIGHT
            x: -70
            y: 4
            width: 48
            height: 48
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F00F0"
                  text_font: mdi_32
                  text_color: 0xB4B2A9
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(touch_guard);'
                  then:
                    - lambda: |-
                        auto t = id(sntp_time).now();
                        if (t.is_valid()) id(ui_day) = (t.day_of_week + 5) % 7;
                    - script.execute: refresh_editor
                    - lvgl.page.show: pg_prog
        - arc:
