# ============================================================
#  SIMULATORE (generato da termostato_esphome.yaml)
#  Gira sul PC con la piattaforma "host" di ESPHome e una finestra SDL 480x480:
#  il mouse fa da touch. Stessa logica, programma, interfaccia LVGL e stand-by del vero.
#  Differenze: sensore e relè sono simulati (la stanza si scalda col relè acceso),
#  il Wi-Fi è un interruttore ("Wi-Fi simulato"), i tempi minimi del termostato sono 20 s.
#
#  Uso (Linux/macOS/WSL):   pip install esphome  +  libsdl2-dev installato
#                           esphome run termostato_sim.yaml
# ============================================================
#  Termostato smart autonomo - Guition ESP32-S3-4848S040 (versione con relè)
#  ESPHome: termostato on-device + programma settimanale + ora via internet (SNTP)
#  + interfaccia LVGL con icone MDI e icona Wi-Fi + stand-by e luminosità giorno/notte.
#
#  Autonomia: il termostato gira sul chip. Senza HA e senza rete continua a regolare.
#  Il programma settimanale (48 mezz'ore x 7 giorni) si modifica dal pannello (pagina Programma,
#  icona calendario) e resta salvato nella flash del dispositivo.
#  L'ora arriva via SNTP con fuso Europe/Rome (ora solare/legale automatica).
#  Finché l'ora non è valida (blackout senza rete) resta il preset Eco.
# ============================================================

substitutions:
  device_name: termostato-sim
  friendly_name: "Termostato Casa"
  temp_comfort: "20.5"
  temp_eco: "17.0"
  wifi_ok_expr: "id(sim_wifi).state"
  glyphs: " %()+,-.:·0123456789°ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzàèéìòù"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - script.execute: wake_screen

logger:

climate:
  - platform: thermostat
    id: termostato
    name: "Termostato"
    sensor: temp_stanza
    min_idle_time: 30s
    min_heating_off_time: 20s    # protegge la caldaia dai cicli brevi
    min_heating_run_time: 20s
    heat_deadband: 0.3 °C         # accende a (setpoint - 0.3)
    heat_overrun: 0.2 °C          # spegne a (setpoint + 0.2)
    heat_action:
      - switch.turn_on: relay_caldaia
    idle_action:
      - switch.turn_off: relay_caldaia
    on_boot_restore_from: default_preset   # avvio deterministico: Eco finché il programma non parte
    default_preset: Eco
    preset:
      - name: Eco
        mode: heat
        default_target_temperature_low: ${temp_eco} °C
      - name: Comfort
        mode: heat
        default_target_temperature_low: ${temp_comfort} °C
    visual:
      min_temperature: 15 °C
      max_temperature: 24 °C
      temperature_step: 0.5 °C

# --- Stato condiviso ---
globals:
  - id: sim_temp
    type: float
    initial_value: '18.0'
  - id: last_slot        # -1 non applicato, 0 Eco, 1 Comfort
    type: int
    initial_value: '-1'
  - id: ui_preset        # 0 manuale, 1 Eco, 2 Comfort (solo per evidenziare i chip)
    type: int
    initial_value: '1'
  - id: screen_on
    type: bool
    initial_value: 'true'
  - id: touch_guard      # ignora i tocchi che hanno solo svegliato lo schermo
    type: bool
    initial_value: 'false'
  - id: ui_day            # giorno mostrato nell'editor: 0 = lunedì ... 6 = domenica
    type: int
    initial_value: '0'
  - id: sched_0           # programma del giorno 0 (0 = lunedì): bit i = mezz'ora i, 1 = Comfort
    type: uint64_t
    restore_value: true
    initial_value: '35150012473344ULL'
  - id: sched_1           # programma del giorno 1 (0 = lunedì): bit i = mezz'ora i, 1 = Comfort
    type: uint64_t
    restore_value: true
    initial_value: '35150012473344ULL'
  - id: sched_2           # programma del giorno 2 (0 = lunedì): bit i = mezz'ora i, 1 = Comfort
    type: uint64_t
    restore_value: true
    initial_value: '35150012473344ULL'
  - id: sched_3           # programma del giorno 3 (0 = lunedì): bit i = mezz'ora i, 1 = Comfort
    type: uint64_t
    restore_value: true
    initial_value: '35150012473344ULL'
  - id: sched_4           # programma del giorno 4 (0 = lunedì): bit i = mezz'ora i, 1 = Comfort
    type: uint64_t
    restore_value: true
    initial_value: '35150012473344ULL'
  - id: sched_5           # programma del giorno 5 (0 = lunedì): bit i = mezz'ora i, 1 = Comfort
    type: uint64_t
    restore_value: true
    initial_value: '35184372056064ULL'
  - id: sched_6           # programma del giorno 6 (0 = lunedì): bit i = mezz'ora i, 1 = Comfort
    type: uint64_t
    restore_value: true
    initial_value: '35184372056064ULL'

# --- Retroilluminazione ---
light:
  - platform: monochromatic
    id: display_backlight
    name: "Retroilluminazione"
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 1s

# Il tramonto è calcolato in locale (serve solo l'ora valida). Coordinate approssimative di Staranzano.
sun:
  id: sole
  latitude: 45.8°
  longitude: 13.5°

script:
  # Accende lo schermo con la luminosità giusta e fa ripartire il conto alla rovescia.
  - id: wake_screen
    mode: restart
    then:
      - lambda: |-
          if (!id(screen_on)) id(touch_guard) = true;
          id(screen_on) = true;
      - light.turn_on:
          id: display_backlight
          brightness: !lambda |-
            auto t = id(sntp_time).now();
            // giorno = sole sopra l'orizzonte E tra le 06:00 e le 21:00; ora non valida -> giorno
            bool day = !t.is_valid() || (id(sole).elevation() > 0 && t.hour >= 6 && t.hour < 21);   // CAMBIA orari
            return day ? 1.0f : 0.15f;                                                               // CAMBIA luminosità
          transition_length: 300ms
      - script.execute: guard_release
      - script.execute: screen_timer
  - id: guard_release
    mode: restart
    then:
      - delay: 600ms
      - lambda: 'id(touch_guard) = false;'
  - id: screen_timer
    mode: restart
    then:
      - delay: 30s                                                                                   # CAMBIA timeout stand-by
      - light.turn_off:
          id: display_backlight
          transition_length: 1s
      - lvgl.page.show: pg_main
      - lambda: 'id(screen_on) = false;'

  # --- Editor del programma ---
  - id: refresh_editor
    then:
      - lambda: |-
          uint64_t *S[7] = {&id(sched_0), &id(sched_1), &id(sched_2), &id(sched_3), &id(sched_4), &id(sched_5), &id(sched_6)};
          lv_obj_t *cells[48] = {id(cell_0), id(cell_1), id(cell_2), id(cell_3), id(cell_4), id(cell_5), id(cell_6), id(cell_7), id(cell_8), id(cell_9), id(cell_10), id(cell_11), id(cell_12), id(cell_13), id(cell_14), id(cell_15), id(cell_16), id(cell_17), id(cell_18), id(cell_19), id(cell_20), id(cell_21), id(cell_22), id(cell_23), id(cell_24), id(cell_25), id(cell_26), id(cell_27), id(cell_28), id(cell_29), id(cell_30), id(cell_31), id(cell_32), id(cell_33), id(cell_34), id(cell_35), id(cell_36), id(cell_37), id(cell_38), id(cell_39), id(cell_40), id(cell_41), id(cell_42), id(cell_43), id(cell_44), id(cell_45), id(cell_46), id(cell_47)};
          lv_obj_t *tabs[7] = {id(tab_0), id(tab_1), id(tab_2), id(tab_3), id(tab_4), id(tab_5), id(tab_6)};
          lv_obj_t *tabl[7] = {id(tabl_0), id(tabl_1), id(tabl_2), id(tabl_3), id(tabl_4), id(tabl_5), id(tabl_6)};
          int d = id(ui_day);
          uint64_t mask = *S[d] & ((1ULL << 48) - 1);
          auto t = id(sntp_time).now();
          int today = t.is_valid() ? (t.day_of_week + 5) % 7 : -1;
          int now_idx = t.is_valid() ? (t.hour * 60 + t.minute) / 30 : -1;
          for (int i = 0; i < 48; i++) {
            bool on = ((mask >> i) & 1ULL) != 0;
            bool mark = (d == today && i == now_idx);
            lv_obj_set_style_bg_color(cells[i], lv_color_hex(on ? 0xEF9F27 : 0x2C2C2A), LV_PART_MAIN);
            lv_obj_set_style_border_color(cells[i], lv_color_hex(mark ? 0xF1EFE8 : (on ? 0xEF9F27 : 0x444441)), LV_PART_MAIN);
            lv_obj_set_style_border_width(cells[i], mark ? 3 : 1, LV_PART_MAIN);
          }
          for (int k = 0; k < 7; k++) {
            bool sel = (k == d);
            lv_obj_set_style_bg_color(tabs[k], lv_color_hex(sel ? 0xF1EFE8 : 0x161615), LV_PART_MAIN);
            lv_obj_set_style_border_color(tabs[k], lv_color_hex(sel ? 0xF1EFE8 : 0x5F5E5A), LV_PART_MAIN);
            lv_obj_set_style_text_color(tabl[k], lv_color_hex(sel ? 0x161615 : 0xB4B2A9), LV_PART_MAIN);
          }
          int cm = __builtin_popcountll(mask) * 30;
          int em = 1440 - cm;
          char b[56];
          snprintf(b, sizeof(b), "Comfort %d h%s · Eco %d h%s", cm / 60, (cm % 60) ? " 30" : "", em / 60, (em % 60) ? " 30" : "");
          lv_label_set_text(id(lbl_sum), b);
  - id: toggle_cell
    parameters:
      idx: int
    then:
      - if:
          condition:
            lambda: 'return !id(touch_guard);'
          then:
            - lambda: |-
                uint64_t *S[7] = {&id(sched_0), &id(sched_1), &id(sched_2), &id(sched_3), &id(sched_4), &id(sched_5), &id(sched_6)};
                *S[id(ui_day)] ^= (1ULL << idx);
                id(last_slot) = -1;       // riapplica subito il programma
            - script.execute: refresh_editor
            - script.execute: show_saved
  - id: select_day
    parameters:
      d: int
    then:
      - if:
          condition:
            lambda: 'return !id(touch_guard);'
          then:
            - lambda: 'id(ui_day) = d;'
            - script.execute: refresh_editor
  - id: copy_day
    parameters:
      n_days: int
    then:
      - if:
          condition:
            lambda: 'return !id(touch_guard);'
          then:
            - lambda: |-
                uint64_t *S[7] = {&id(sched_0), &id(sched_1), &id(sched_2), &id(sched_3), &id(sched_4), &id(sched_5), &id(sched_6)};
                uint64_t m = *S[id(ui_day)];
                for (int i = 0; i < n_days; i++) *S[i] = m;
                id(last_slot) = -1;       // riapplica subito il programma
            - script.execute: refresh_editor
            - script.execute: show_saved
  - id: show_saved
    mode: restart
    then:
      - lambda: 'lv_obj_clear_flag(id(lbl_saved), LV_OBJ_FLAG_HIDDEN);'
      - delay: 1200ms
      - lambda: 'lv_obj_add_flag(id(lbl_saved), LV_OBJ_FLAG_HIDDEN);'

# --- Programma settimanale + aggiornamento interfaccia (ogni 500 ms) ---
# Il programma applica Comfort/Eco solo quando la fascia CAMBIA, così un override
# manuale resta valido fino alla prossima transizione. Gli orari si modificano dal pannello.
interval:
  - interval: 500ms
    then:
      - lambda: |-
          auto t = id(sntp_time).now();
          uint64_t *S[7] = {&id(sched_0), &id(sched_1), &id(sched_2), &id(sched_3), &id(sched_4), &id(sched_5), &id(sched_6)};
          auto comfort_at = [&](int dow, int m) -> bool {     // dow: 1 = domenica ... 7 = sabato; programma: 0 = lunedì ... 6 = domenica
            return ((*S[(dow + 5) % 7] >> (m / 30)) & 1ULL) != 0;
          };
          static const char *giorni[] = {"dom", "lun", "mar", "mer", "gio", "ven", "sab"};
          static const char *mesi[] = {"gen", "feb", "mar", "apr", "mag", "giu", "lug", "ago", "set", "ott", "nov", "dic"};
          static int last_min = -1;
          static char nxt[56] = "Ora non disponibile";
          char buf[56];

          if (t.is_valid()) {
            int m = t.hour * 60 + t.minute;
            int slot = comfort_at(t.day_of_week, m) ? 1 : 0;
            if (slot != id(last_slot)) {
              id(last_slot) = slot;
              id(ui_preset) = slot ? 2 : 1;
              auto call = id(termostato).make_call();
              call.set_preset(slot ? climate::CLIMATE_PRESET_COMFORT : climate::CLIMATE_PRESET_ECO);
              call.perform();
            }
            snprintf(buf, sizeof(buf), "%02d:%02d · %s %d %s", t.hour, t.minute,
                     giorni[t.day_of_week - 1], t.day_of_month, mesi[t.month - 1]);
            if (m != last_min) {
              last_min = m;
              snprintf(nxt, sizeof(nxt), "Programma invariato");
              for (int k = 1; k <= 7 * 1440; k++) {
                int tot = m + k;
                int dd = tot / 1440;
                int mm = tot % 1440;
                int dw = (t.day_of_week - 1 + dd) % 7 + 1;
                if (comfort_at(dw, mm) != (slot == 1)) {
                  if (dd == 0)
                    snprintf(nxt, sizeof(nxt), "Prossima fascia %02d:%02d · %s", mm / 60, mm % 60, slot ? "Eco" : "Comfort");
                  else
                    snprintf(nxt, sizeof(nxt), "Prossima fascia %s %02d:%02d · %s", giorni[dw - 1], mm / 60, mm % 60, slot ? "Eco" : "Comfort");
                  break;
                }
              }
            }
          } else {
            snprintf(buf, sizeof(buf), "--:--");
            snprintf(nxt, sizeof(nxt), "Ora non disponibile");
            last_min = -1;
          }

          float cur = id(temp_stanza).state;
          float hum = id(hum_stanza).state;
          float sp = id(termostato).target_temperature;
          if (std::isnan(sp)) sp = 20.0f;
          bool heat = id(relay_caldaia).state;
          bool wifi_ok = ${wifi_ok_expr};
          char tmp[24];

          lv_label_set_text(id(lbl_time), buf);
          lv_label_set_text(id(lbl_next), nxt);

          if (std::isnan(cur)) snprintf(tmp, sizeof(tmp), "--.-°"); else snprintf(tmp, sizeof(tmp), "%.1f°", cur);
          lv_label_set_text(id(lbl_cur), tmp);
          if (std::isnan(hum)) snprintf(tmp, sizeof(tmp), "--%% · interno"); else snprintf(tmp, sizeof(tmp), "%.0f%% · interno", hum);
          lv_label_set_text(id(lbl_hum), tmp);
          snprintf(tmp, sizeof(tmp), "Imposta %.1f°", sp);
          lv_label_set_text(id(lbl_sp), tmp);

          lv_arc_set_value(id(arc_sp), (int) roundf(sp * 10.0f));
          uint32_t col = heat ? 0xEF9F27 : 0x5DCAA5;
          lv_obj_set_style_arc_color(id(arc_sp), lv_color_hex(col), LV_PART_INDICATOR);
          lv_obj_set_style_text_color(id(lbl_sp), lv_color_hex(col), LV_PART_MAIN);

          lv_obj_set_style_bg_color(id(pill), lv_color_hex(heat ? 0x412402 : 0x2C2C2A), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(pill_ic), lv_color_hex(heat ? 0xFAC775 : 0x888780), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(pill_tx), lv_color_hex(heat ? 0xFAC775 : 0xB4B2A9), LV_PART_MAIN);
          lv_label_set_text(id(pill_tx), heat ? "Caldaia accesa" : "In attesa");

          // icona Wi-Fi: normale se connesso, barrata e ambra se la rete manca
          lv_label_set_text(id(lbl_wifi), wifi_ok ? "\U000F05A9" : "\U000F05AA");
          lv_obj_set_style_text_color(id(lbl_wifi), lv_color_hex(wifi_ok ? 0xB4B2A9 : 0xEF9F27), LV_PART_MAIN);

          bool eco = (id(ui_preset) == 1), cmf = (id(ui_preset) == 2);
          lv_obj_set_style_bg_color(id(chip_eco), lv_color_hex(eco ? 0xF1EFE8 : 0x161615), LV_PART_MAIN);
          lv_obj_set_style_border_color(id(chip_eco), lv_color_hex(eco ? 0xF1EFE8 : 0x5F5E5A), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(chip_eco_ic), lv_color_hex(eco ? 0x161615 : 0xB4B2A9), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(chip_eco_tx), lv_color_hex(eco ? 0x161615 : 0xB4B2A9), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(chip_cmf), lv_color_hex(cmf ? 0xF1EFE8 : 0x161615), LV_PART_MAIN);
          lv_obj_set_style_border_color(id(chip_cmf), lv_color_hex(cmf ? 0xF1EFE8 : 0x5F5E5A), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(chip_cmf_ic), lv_color_hex(cmf ? 0x161615 : 0xB4B2A9), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(chip_cmf_tx), lv_color_hex(cmf ? 0x161615 : 0xB4B2A9), LV_PART_MAIN);

  # Simulazione fisica: con il relè acceso la stanza si scalda, spento si raffredda
  - interval: 5s
    then:
      - lambda: |-
          if (id(relay_caldaia).state) id(sim_temp) += 0.15f;
          else id(sim_temp) -= 0.05f;
          if (id(sim_temp) < 12.0f) id(sim_temp) = 12.0f;
          if (id(sim_temp) > 30.0f) id(sim_temp) = 30.0f;

# --- Pulsante per riprendere il programma dopo un override manuale ---
button:
  - platform: template
    name: "Riprendi programma"
    on_press:
      - lambda: 'id(last_slot) = -1;'

# ============================================================
#  Display, touch, font e interfaccia LVGL
# ============================================================
font:
  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: r_big
    size: 80
    glyphs: "0123456789.°-"
  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: r_24
    size: 24
    glyphs: ${glyphs}
  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: r_18
    size: 18
    glyphs: ${glyphs}
  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: r_16
    size: 16
    glyphs: ${glyphs}
